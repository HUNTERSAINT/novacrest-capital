name: Build NovaCrest native Android APK

on:
  push:
    branches:
      - native-app-mode-fixes
    paths:
      - 'artifacts/novacrest-mobile/**'
      - '.github/workflows/novacrest-native-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_DOMAIN: novacrestfi.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace type declarations
        run: pnpm run typecheck:libs

      - name: Typecheck native app
        run: pnpm --filter @workspace/novacrest-mobile exec tsc -p tsconfig.native-check.json --noEmit

      - name: Generate Android native project
        working-directory: artifacts/novacrest-mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: artifacts/novacrest-mobile/android
        run: ./gradlew --no-daemon assembleRelease

      - name: Enable KVM for Android emulator
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM device unavailable; emulator may not boot on this runner."
          fi

      - name: Test app launch and signup navigation in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            mkdir -p artifacts/novacrest-mobile/android-startup-test
            adb install artifacts/novacrest-mobile/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -n com.novacrest.mobile/.MainActivity
            sleep 25
            adb shell uiautomator dump /sdcard/login.xml
            adb pull /sdcard/login.xml artifacts/novacrest-mobile/android-startup-test/login.xml
            adb shell screencap -p /sdcard/login.png
            adb pull /sdcard/login.png artifacts/novacrest-mobile/android-startup-test/login.png
            grep -q "Member Access" artifacts/novacrest-mobile/android-startup-test/login.xml
            grep -q "Apply for membership" artifacts/novacrest-mobile/android-startup-test/login.xml
            adb shell input tap 730 1505
            sleep 5
            adb shell uiautomator dump /sdcard/register.xml
            adb pull /sdcard/register.xml artifacts/novacrest-mobile/android-startup-test/register.xml
            adb shell screencap -p /sdcard/register.png
            adb pull /sdcard/register.png artifacts/novacrest-mobile/android-startup-test/register.png
            grep -q "Create Account" artifacts/novacrest-mobile/android-startup-test/register.xml
            grep -q "Apply for Membership" artifacts/novacrest-mobile/android-startup-test/register.xml
            grep -q "Sign in" artifacts/novacrest-mobile/android-startup-test/register.xml
            adb logcat -d > artifacts/novacrest-mobile/android-startup-test/logcat.txt
            if grep -qE 'FATAL EXCEPTION|Unable to load script|ReactNativeJS.*(Error|error)' artifacts/novacrest-mobile/android-startup-test/logcat.txt; then
              echo 'App startup/navigation errors detected in emulator log' >&2
              exit 1
            fi

      - name: Upload emulator startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novacrest-emulator-startup-diagnostics
          path: artifacts/novacrest-mobile/android-startup-test/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novacrest-native-android-apk
          path: artifacts/novacrest-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
