name: Build NovaCrest Android APK

on:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/novacrest-android.yml"
    tags:
      - "novacrest-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: android-wrapper/package.json

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/novacrest-capital.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novacrest-capital-android
          path: android-wrapper/release/novacrest-capital.apk
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/novacrest-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-wrapper/release/novacrest-capital.apk
          generate_release_notes: true
